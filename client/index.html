<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f2e2b">
  <title>Number Merge Puzzle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1 class="title">Number Merge<br>Puzzle</h1>
      <div class="score-area">
        <div class="score-box">
          <span class="score-label">Score</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">Best</span>
          <span class="score-value" id="best-score">0</span>
        </div>
      </div>
    </header>

    <p class="tagline">Slide the tiles. Merge matching numbers. Reach <strong>2048</strong>!</p>

    <div class="controls-row">
      <span class="moves">Moves: <strong id="move-count">0</strong></span>
      <div class="buttons">
        <button type="button" id="undo-btn" class="btn btn-secondary" disabled>Undo</button>
        <button type="button" id="new-game-btn" class="btn btn-primary">New Game</button>
      </div>
    </div>

    <div class="grid-wrap">
      <div class="grid" id="grid" aria-label="Number Merge Puzzle board" role="grid">
        <!-- 16 cells are rendered by js/app.js -->
      </div>

      <div class="overlay hidden" id="win-overlay" role="dialog" aria-label="You win">
        <div class="overlay-card">
          <h2>You did it! 🎉</h2>
          <p>You reached <strong>2048</strong>!</p>
          <p class="overlay-score">Score: <span id="win-score">0</span></p>
          <button type="button" id="keep-playing-btn" class="btn btn-primary">Keep playing</button>
          <button type="button" id="win-new-game-btn" class="btn btn-secondary">New game</button>
        </div>
      </div>

      <div class="overlay hidden" id="game-over-overlay" role="dialog" aria-label="Game over">
        <div class="overlay-card">
          <h2>Game over</h2>
          <p>No more moves left.</p>
          <p class="overlay-score">Score: <span id="game-over-score">0</span></p>
          <button type="button" id="try-again-btn" class="btn btn-primary">Try again</button>
        </div>
      </div>
    </div>

    <div class="dpad" aria-label="Move controls">
      <button type="button" class="dpad-btn" data-direction="up" aria-label="Move up">▲</button>
      <button type="button" class="dpad-btn" data-direction="left" aria-label="Move left">◀</button>
      <button type="button" class="dpad-btn" data-direction="down" aria-label="Move down">▼</button>
      <button type="button" class="dpad-btn" data-direction="right" aria-label="Move right">▶</button>
    </div>

    <p class="hint">Use arrow keys, WASD, swipe, or the buttons above.</p>
  </main>

  <script src="js/game-logic.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
